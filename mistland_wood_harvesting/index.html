<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/png" href="./favicon.png" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="stylesheet" href="./style.css"> -->
    <title>XXXXX</title>
    <script>
    // ● gemsNeeded: amount of gems needed to unlock the workshop
    // ● woodNeeded: amount of wood needed
    // ● backpackSize: amount of wood character can carry before upgrading axe
    // ● walkSpeed: character movement speed
    // ● skeletons: on/off: optional skeletons that roam the village
    // ● perspectiveCamera: on/off: use perspective camera
    // ● hintTimer: time before a hint is shown after initial hint in sec.
    // ● tapstoAutoRedirect: taps to redirect, o to disable
    // ● redirectType: redirect to store on tap or release
    // ● hideLogo: hides in game logo. on/off
    // ● fullScreenCta: if active, interaction anywhere on end card will redirect
    // ● hideCta: hides in game CTA button. on/off
    // ● playSfx: turn on/off the SFX
    // ● playMusic: turn on/off music
    // ● musicVolume: set the volume of the music, 1-100
    // ● timer: set time before player fails in seconds, 0 to disable

    var params = {
        gemsNeeded: { value: 20, default: 20, min: 0, max: 100, type: "number", description: 'gemsNeeded: amount of gems needed to unlock the workshop' },
        woodNeeded: { value: 20, default: 10, min: 0, max: 100, type: "number", description: 'woodNeeded: amount of wood needed' },
        backpackSize: { value: 100, default: 10, min: 0, max: 1000, type: "number", description: 'backpackSize: amount of wood character can carry before upgrading axe' },
        walkSpeed: { value: 7, default: 10, min: 1, max: 25, type: "number", description: 'walkSpeed: character movement speed' },
        skeletons: { value: true, default: true, type: "boolean", description: 'skeletons: on/off: optional skeletons that roam the village' },
        perspectiveCamera: { value: false, default: true, type: "boolean", description: 'perspectiveCamera: on/off: use perspective camera' },
        hintTimer: { value: 10, default: 10, min: 0, max: 30, type: "number", description: 'hintTimer: time before a hint is shown after initial hint in sec.' },
        tapstoAutoRedirect: { value: 1, default: 1, min: 0, max: 1, type: "number", description: 'tapstoAutoRedirect: taps to redirect, 0 to disable' },
        redirectType: { value: 'tap', default: 'tap', type: "string", description: 'redirectType: redirect to store on tap or release' },
        hideLogo: { value: false, default: false, type: "boolean", description: 'hideLogo: hides in game logo. on/off' },
        fullScreenCta: { value: true, default: true, type: "boolean", description: 'fullScreenCta: if active, interaction anywhere on end card will redirect' },
        hideCta: { value: false, default: false, type: "boolean", description: 'hideCta: hides in game CTA button. on/off' },
        playSfx: { value: true, default: true, type: "boolean", description: 'playSfx: turn on/off the SFX' },
        playMusic: { value: true, default: true, type: "boolean", description: 'playMusic: turn on/off music' },
        musicVolume: { value: 100, default: 100, min: 0, max: 100, type: "number", description: 'musicVolume: set the volume of the music, 1-100' },
        timer: { value: 0, default: 0, min: 0, max: 120, type: "number", description: 'timer: set time before player fails in seconds, 0 to disable' },
        locale: { value: 'en', default: 'en', type: "string", description: 'locale: options are en || fr' },
    };

    var texts = {
	en: {
		inGameCta: 'Download Now!',
		tutorial: 'Tap to start level',
        winPopup: "Your strength ensures our survival! The village thrives thanks to you!"
	},
	fr: {
		inGameCta: '...',
		tutorial: '...'
	}}


    // getters from params in index.html
    function getParamsNumberByID( id ) {
        const config =  params[ id ]; 
        if( !config ) 
        {
            console.error("attempt to get invalid param property : ", id );      
            return;
        }
        if( config.value >= config.max ) return config.max;
        else if( config.value <= config.min ) return config.min;
        else return config.value;
    }

    function isPortrait()
    {
        return window.innerWidth < window.innerHeight
    }

    </script>
</head>

<body>
    <div id="app">
        <div id="game-container"></div>
    </div>
    <div id="ui-overlay">
        <div id="header-container">
            <div id="logo-container"></div>
            <div id="button-container"></div>
        </div>
    </div>
    <div id="ui-overlay-cta-portrait"  class="hide-in-landscape">
        <div id="cta-bg-container-portrait" style="width: 100vw; height: 100vh; overflow: hidden; position: absolute;"></div>
        <div id="cta-logo-container-portrait"></div>
        <div class="spacer"></div>
        <div id="cta-button-container-portrait"></div>
    </div>
    <div id="ui-overlay-cta-landscape"  class="hide-in-portrait">
        <div id="cta-bg-container-landscape" style="width: 100vw; height: 100vh; overflow: hidden; position: absolute;"></div>
        
        <div class="spacer"></div>
        
        <div id="right-side-container">
            <div id="cta-logo-container-landscape"></div>
            <div id="cta-button-container-landscape"></div>
        </div>

    </div>
    <div id="zone_joystick"></div>
    <div id="pixi-container"></div>
</body>
</html>
